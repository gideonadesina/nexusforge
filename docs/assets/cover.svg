<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 840" width="1600" height="840" role="img" aria-label="NexusForge: the contract nobody knew was at risk">
<style>
.t{font:700 66px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#ebe9e6}
.t2{font:700 66px ui-sans-serif,system-ui,sans-serif;fill:#4db6ac}
.s{font:400 25px ui-sans-serif,system-ui,sans-serif;fill:#a8a29b}
.m{font:400 17px ui-monospace,Menlo,monospace;fill:#76706a}
