.brand{font:600 20px ui-sans-serif,system-ui,sans-serif;fill:#ebe9e6;letter-spacing:.14em}
.brandsub{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#76706a}
.node{fill:#242322;stroke:#332f2c}
.nodeA{fill:#242322;stroke:#4db6ac;stroke-width:2}
.lab{font:400 13px ui-monospace,Menlo,monospace;fill:#a8a29b}
