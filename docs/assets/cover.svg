<rect width="1600" height="840" fill="#141413"/>
<line x1="980" y1="0" x2="980" y2="840" stroke="#332f2c" stroke-width="1" opacity="0.5"/>
<line x1="1100" y1="0" x2="1100" y2="840" stroke="#332f2c" stroke-width="1" opacity="0.5"/>
<line x1="1220" y1="0" x2="1220" y2="840" stroke="#332f2c" stroke-width="1" opacity="0.5"/>
